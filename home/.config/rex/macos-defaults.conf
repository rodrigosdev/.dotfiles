# Rex app settings, in the macOS defaults domain com.superlogical.rex.
#
# init.lua cannot set these. `dot rex`, `dot init`, and `dot update` write each
# line with `defaults write` when the current value differs. Rex reads most of
# them at launch, so relaunch Rex after a change.
#
# Format: KEY TYPE VALUE. TYPE is a `defaults write` type: string, int, float,
# or bool. Lines starting with # are skipped.
#
# Key names come from the app binary:
#   strings "/Applications/Rex Beta.app/Contents/MacOS/Rex" | grep '^Workspace\.'
#
# The theme is not set here. Workspace.customThemes is a blob keyed by a
# generated ID. `dot rex` imports themes/oscura-midnight when it is missing.

# Font. Ioskeley Mono Term comes from `dot init` and `dot update`.
Workspace.terminalFontName              string  Ioskeley Mono Term
Workspace.terminalFontPointSize         float   16
Workspace.terminalCopyOnSelect          bool    true

# Window and tabs.
Workspace.appearance                    string  system
Workspace.interfaceStyle                string  useTheme
Workspace.animationStyle                string  off
Workspace.tabStyle                      string  vertical
Workspace.tabIconTintMode               string  off
Workspace.tabsFillAvailableSpace        bool    false

# Sidebar. Position is left or right. Swipe is swipe, optionSwipe, or off.
Workspace.sidebarPosition               string  right
Workspace.sidebarShowsActivity          bool    true
Workspace.preservesWindowWidthOnSidebarToggle  bool  true
Workspace.sidebarSwipe                  string  off

# Panes. Density is comfortable or compact.
Workspace.paneDensity                   string  compact
Workspace.inactivePaneFadeMode          string  both

# Lets `rex do` and `rex -C` run app actions. `dot rex` needs it for the theme import.
rex.client.remoteControl                bool    true
rex.server.automatic-restart-enabled    bool    true
